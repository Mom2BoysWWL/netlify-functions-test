<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Functions Test</title>
</head>
<body>
    <h1>Hello, Netlify Functions!</h1>
    <!DOCTYPE html>
<html>
  <body>
    <h1>Test Netlify Function</h1>
    <input id="name" placeholder="Enter your name" />
    <button onclick="callFunction()">Say Hello</button>

    <p id="output"></p>

    <h2>Cancel Subscription</h2>
    <input id="subscriptionId" placeholder="Enter your subscription ID" />
    <button onclick="cancelSubscription()">Cancel Subscription</button>
    <p id="cancel-output"></p>

    <script>
      async function callFunction() {
        const name = document.getElementById("name").value;
        const res = await fetch(
          `/.netlify/functions/hello?name=${name}`
        );
        const data = await res.json();
        document.getElementById("output").innerText = data.message;
      }

      async function cancelSubscription() {
        const subscriptionId = document.getElementById("subscriptionId").value.trim();
        const outputEl = document.getElementById("cancel-output");
        if (!subscriptionId) {
          outputEl.innerText = "Please enter a subscription ID.";
          return;
        }
        outputEl.innerText = "Cancelling...";
        try {
          const res = await fetch("/.netlify/functions/cancel-subscription", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subscriptionId })
          });
          const data = await res.json();
          outputEl.innerText = data.message || data.error || "Unknown response";
        } catch (err) {
          outputEl.innerText = "Error: " + err.message;
        }
      }
    </script>
  </body>
</html>
